<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white p-4 flex justify-between">
    <h1 class="text-xl font-semibold">Event Manager</h1>
    <div class="space-x-4">
      <a href="guests.html" class="hover:underline">Guests</a>
           <a href="send.html" class="hover:underline">Send Invitations</a>
       <a href="responses.html" class="hover:underline font-semibold">Responses</a>
    </div>
  </nav>

  <main class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold text-gray-800">Events</h2>
      <button id="addEventBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        + Add Event
      </button>
    </div>

    <!-- Event List -->
    <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <!-- Events will appear here -->
    </div>
  </main>

  <!-- Modal for Adding/Editing Event -->
  <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
      <h3 id="modalTitle" class="text-xl font-semibold mb-4">Add Event</h3>

      <label class="block mb-2 text-gray-700">Title</label>
      <input id="titlu" type="text" class="w-full border p-2 rounded mb-3" placeholder="Event title" />

      <label class="block mb-2 text-gray-700">Date</label>
      <input id="data" type="date" class="w-full border p-2 rounded mb-3" />

      <label class="block mb-2 text-gray-700">Time</label>
      <input id="ora" type="time" class="w-full border p-2 rounded mb-3" />

      <label class="block mb-2 text-gray-700">Location</label>
      <input id="locatie" type="text" class="w-full border p-2 rounded mb-3" placeholder="Location" />

      <label class="block mb-2 text-gray-700">Description</label>
      <textarea id="descriere" rows="3" class="w-full border p-2 rounded mb-4" placeholder="Short description"></textarea>

      <div class="flex justify-end space-x-2">
        <button id="cancelBtn" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Cancel</button>
        <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById("eventsContainer");
    const modal = document.getElementById("eventModal");
    const addEventBtn = document.getElementById("addEventBtn");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const titlu = document.getElementById("titlu");
    const data = document.getElementById("data");
    const ora = document.getElementById("ora");
    const locatie = document.getElementById("locatie");
    const descriere = document.getElementById("descriere");

    let editId = null;

    // Load all events
    async function loadEvents() {
      try {
        const res = await fetch("/api/events");
        const events = await res.json();
        renderEvents(events);
      } catch (err) {
        console.error("Error loading events:", err);
      }
    }

    function renderEvents(events) {
      if (!Array.isArray(events) || events.length === 0) {
        container.innerHTML = `<p class='text-gray-600'>No events yet. Click "Add Event" to create one.</p>`;
        return;
      }

      container.innerHTML = events
        .map(
          (e) => `
          <div class="bg-white rounded-xl shadow p-4 border">
            <h3 class="text-lg font-semibold text-gray-800 mb-1">${e.titlu}</h3>
            <p class="text-sm text-gray-600">${e.data} • ${e.ora}</p>
            <p class="text-sm text-gray-600 mb-2">${e.locatie}</p>
            <p class="text-gray-700 mb-3">${e.descriere || ""}</p>
            <div class="flex justify-end space-x-2">
              <button onclick="editEvent('${e.id}')" class="px-3 py-1 bg-yellow-400 text-white rounded hover:bg-yellow-500">Edit</button>
              <button onclick="deleteEvent('${e.id}')" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Delete</button>
            </div>
          </div>`
        )
        .join("");
    }

    function openModal() {
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
      titlu.value = "";
      data.value = "";
      ora.value = "";
      locatie.value = "";
      descriere.value = "";
      editId = null;
    }

    addEventBtn.onclick = () => {
      document.getElementById("modalTitle").textContent = "Add Event";
      openModal();
    };

    cancelBtn.onclick = closeModal;

    saveBtn.onclick = async () => {
      const eventData = {
        titlu: titlu.value.trim(),
        data: data.value.trim(),
        ora: ora.value.trim(),
        locatie: locatie.value.trim(),
        descriere: descriere.value.trim()
      };

      if (!eventData.titlu || !eventData.data) {
        alert("Please provide at least a title and date.");
        return;
      }

      try {
        const url = editId ? `/api/events/${editId}` : "/api/events";
        const method = editId ? "PUT" : "POST";

        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(eventData)
        });

        if (!res.ok) throw new Error("Failed to save event");

        closeModal();
        loadEvents();
      } catch (err) {
        console.error("Error saving event:", err);
        alert("Failed to save event.");
      }
    };

    async function editEvent(id) {
      const res = await fetch("/api/events");
      const events = await res.json();
      const ev = events.find((e) => e.id === id);
      if (!ev) return alert("Event not found.");

      editId = ev.id;
      titlu.value = ev.titlu;
      data.value = ev.data;
      ora.value = ev.ora;
      locatie.value = ev.locatie;
      descriere.value = ev.descriere;

      document.getElementById("modalTitle").textContent = "Edit Event";
      openModal();
    }

    async function deleteEvent(id) {
      if (!confirm("Are you sure you want to delete this event?")) return;
      try {
        await fetch(`/api/events/${id}`, { method: "DELETE" });
        loadEvents();
      } catch (err) {
        console.error("Error deleting event:", err);
      }
    }

    loadEvents();
  </script>
</body>
</html>
